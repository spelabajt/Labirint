<!DOCTYPE html>
<html>
<head>
<title>Maze Of Ducks - Audio Reset</title>
<style>
    html, body { margin:0; padding:0; width:100vw; height:100vh; overflow:hidden; }
    body { 
        background: #4F5D3A url('img/raca.png') no-repeat center center; 
        background-size: cover; 
        position: relative; 
    }

    #labirint {
        position: absolute;
        width: 550px; height: 550px; 
        left: 950px; top: 300px;  
    }

    #labirintSlikca {
        position: absolute; width: 100%; height: 100%;
        background: url('img/labirintRaca.png') no-repeat center center;
        background-size: contain; transition: opacity 1s ease; z-index: 1;
    }

    .raca { 
        position: absolute; width: 40px; height: 40px; 
        background: url('img/raca.gif') no-repeat center center; 
        background-size: contain; z-index: 10;
        transition: width 0.5s ease, height 0.5s ease, transform 0.2s ease;
    }

    #mama { 
        position: absolute; left: -150px; top: 200px; width: 40px; z-index: 20;
        transition: transform 0.4s ease; display: block;
    }

    #klikTocka {
        position: absolute;
        left: 155px; top: 114px; 
        width: 40px; height: 40px;
        background: rgba(255, 0, 0, 0); 
        cursor: pointer; z-index: 100;
        border-radius: 50%; transform: translate(-50%, -50%);
    }

    #infoPolje { 
        position: absolute; background: rgba(255,255,255,0.95); 
        padding: 10px; border: 2px solid black; border-radius: 5px; 
        display: none; z-index: 2000; 
        left: 170px; top: 100px;
        font-family: Arial, sans-serif; font-weight: bold;
        box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
    }

    #racaGumb { position: absolute; left: 200px; top: 400px; width: 250px; cursor: pointer; z-index: 1000; }
    #preskociGumb {
        position: absolute; right: 20px; bottom: 20px;
        padding: 5px 8px; background: rgba(0, 0, 0, 0.6);
        color: white; border: 2px solid #fff; border-radius: 5px;
        cursor: pointer; z-index: 2000; font-family: Arial; font-size: 8px;
    }
</style>
</head>
<body>

<div id="labirint">
    <div id="labirintSlikca"></div>
    <img id="mama" src="img/mamaRaca.gif">
    <div id="klikTocka"></div>
    <div id="infoPolje">Špela Bajt</div>
</div>

<img id="racaGumb" src="img/racaGumb.png">
<button id="preskociGumb">NEXT</button>
<audio id="racaAudio" src="music/raca.mp3" loop></audio>

<script>
// INFO POLJE KLIK
document.getElementById('klikTocka').onclick = function() {
    const info = document.getElementById('infoPolje');
    info.style.display = "block";
    setTimeout(() => { info.style.display = "none"; }, 3000); 
};

// NASTAVITVE
const xTocke = [390,390,423,423,390,390,411,411,489,489,519,519,507,507,490,490,474,474,423,423,404,404,436,436,423,423,377,377,326,326,305,305,289,289,307,307,290,290,305,305,273,273,260,260,223,223,206,206,238,238,254,254,272,272,289,289,305,305,289,289,258,258,222,222,239,239,206,206];
const yTocke = [25 ,128,128,145,145,176,176,165,165,180,180,195,195,212,212,194,194,179,179,192,192,210,210,226,226,257,257,277,277,212,212,229,229,246,246,260,260,280,280,306,306,359,359,390,390,425,425,442,442,425,425,442,442,414,414,393,393,455,455,477,477,491,491,473,473,461,461,495];
const xMR = [50, 150, 350, 500, 350, 90], yMR = [220, 250, 220, 300, 330, 300];
const xZ = [262, 230, 201, 171, 146], yZ = [-72, -67, -59, -36, -5];
const xK = [-400, -310, -215, -145, -100], yK = [575, 500, 531, 430, 535];

let vseRace = [], activeIntervals = [], koncaneRace = 0;
const mama = document.getElementById('mama');
const audio = document.getElementById('racaAudio');
const labirintSlikca = document.getElementById('labirintSlikca');

function posodobiVelikostMame(trenutniY) {
    const minY = 200, maxY = 380, minSize = 40, maxSize = 290;
    let odstotek = Math.max(0, Math.min(1, (trenutniY - minY) / (maxY - minY)));
    mama.style.width = (minSize + (odstotek * (maxSize - minSize))) + "px";
}

function premakniMamo(index = 0) {
    if (index >= xMR.length) return;
    const startX = parseFloat(mama.style.left), startY = parseFloat(mama.style.top);
    const targetX = xMR[index], targetY = yMR[index];
    mama.style.transform = targetX > startX ? "scaleX(-1)" : "scaleX(1)";
    const steps = 100; let step = 0;
    const dx = (targetX - startX) / steps, dy = (targetY - startY) / steps;
    const potMama = setInterval(() => {
        if (step >= steps) { clearInterval(potMama); premakniMamo(index + 1); return; }
        mama.style.left = (startX + dx * step) + "px"; mama.style.top = (startY + dy * step) + "px";
        posodobiVelikostMame(startY + dy * step); step++;
    }, 30);
    activeIntervals.push(potMama);
}

function premik(obj, targetX, targetY, isFinal = false, callback) {
    const trenOdmik = (parseFloat(obj.style.width) > 40) ? 30 : 20;
    const startX = parseFloat(obj.style.left) + trenOdmik, startY = parseFloat(obj.style.top) + trenOdmik;
    obj.style.transform = targetX > startX + 0.5 ? "scaleX(-1)" : "scaleX(1)";
    const steps = 50; let step = 0;
    const dx = (targetX - startX) / steps, dy = (targetY - startY) / steps;
    const interval = setInterval(() => {
        if (step >= steps) {
            clearInterval(interval);
            if (isFinal) {
                obj.style.width = "60px"; obj.style.height = "60px";
                obj.style.left = (targetX - 30) + "px"; obj.style.top = (targetY - 30) + "px";
                koncaneRace++;
                if (koncaneRace === 5) { 
                    labirintSlikca.style.opacity = "0"; 
                    setTimeout(() => premakniMamo(0), 2000); 
                }
            }
            if (callback) callback(); return;
        }
        obj.style.left = (startX + dx * step - trenOdmik) + 'px';
        obj.style.top = (startY + dy * step - trenOdmik) + 'px';
        step++;
    }, 5);
    activeIntervals.push(interval);
}

function premakniRaco(racaDiv, index = 0) {
    if (index >= xTocke.length) { premik(racaDiv, xK[racaDiv.dataset.index], yK[racaDiv.dataset.index], true); return; }
    premik(racaDiv, xTocke[index], yTocke[index], false, () => premakniRaco(racaDiv, index + 1));
}

function postaviVse() {
    vseRace.forEach((r, i) => {
        r.style.width = "40px"; r.style.height = "40px";
        r.style.left = (xZ[i] - 20) + 'px'; r.style.top = (yZ[i] - 20) + 'px';
        r.style.transform = "scaleX(-1)";
    });
    mama.style.left = "-150px"; mama.style.top = "200px"; mama.style.width = "40px";
    labirintSlikca.style.opacity = "1"; koncaneRace = 0;
}

window.onload = () => {
    for (let i = 0; i < 5; i++) {
        const r = document.createElement('div'); r.classList.add('raca'); r.dataset.index = i;
        document.getElementById('labirint').appendChild(r); vseRace.push(r);
    }
    postaviVse();
};

document.getElementById('racaGumb').onclick = () => {
    // RESET GLASBE NA ZAČETEK
    audio.currentTime = 0;
    audio.play();

    activeIntervals.forEach(i => clearInterval(i)); 
    activeIntervals = [];
    postaviVse();
    const zamiki = [0, 25000, 47300, 68000, 86800];
    vseRace.forEach((r, i) => setTimeout(() => premakniRaco(r, 0), 2500 + zamiki[i]));
};

document.getElementById('preskociGumb').onclick = () => {
    activeIntervals.forEach(i => clearInterval(i)); activeIntervals = [];
    vseRace.forEach((r, i) => {
        r.style.width = "60px"; r.style.height = "60px";
        r.style.left = (xK[i] - 30) + "px"; r.style.top = (yK[i] - 30) + "px";
    });
    labirintSlikca.style.opacity = "0"; koncaneRace = 5;
    setTimeout(() => premakniMamo(0), 3000);
};
</script>
</body>
</html>
