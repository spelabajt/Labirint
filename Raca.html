<!DOCTYPE html>
<html>
<head>
	<style>
	body{
		background:url('LabirintRaca.png');
		background-repeat: no-repeat;  
		background-size: cover; 
		height: 100%;
		margin: 0;
	}
	.click-point {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background-color: blue;
      cursor: pointer;
	}
	</style>
</head>
<body>
	<div class="click-point" style="top: 240px; left: 1015px;">
</body>
</html>
